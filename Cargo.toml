[package]
name = "rust-streaming-systems-lab"
version = "0.1.0"
edition = "2021"
description = "Independent Rust systems lab for bounded streaming pipelines, concurrent state, backpressure, retries, and graceful shutdown."
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "pipeline"
harness = false
